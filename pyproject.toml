[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitorcheck"
version = "0.1.0"
description = "CLI acadêmica para verificações básicas de conectividade"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
monitorcheck = "monitorcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

